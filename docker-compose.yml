version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/swe_agent.db:/app/backend/swe_agent.db
    environment:
      - DATABASE_PATH=/app/backend/swe_agent.db
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

